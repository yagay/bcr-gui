<div class="call-inline-player" role="group" aria-label="Recording playback position">
  <div class="seek-row">
    <span class="time">{{ (dragging() ? dragPosition() : currentPosition()) | toHms }}</span>
    <ion-range
      aria-label="Seek recording"
      [min]="0"
      [max]="duration() > 0 ? duration() : 1"
      [value]="dragging() ? dragPosition() : currentPosition()"
      [disabled]="!ready()"
      [pin]="true"
      [ticks]="false"
      [snaps]="false"
      (ionKnobMoveStart)="onDragStart()"
      (ionInput)="onDrag($event)"
      (ionKnobMoveEnd)="onDragEnd($event)"
    />
    <span class="time">{{ duration() | toHms }}</span>
  </div>
  <div class="actions">
    <button type="button" [disabled]="!ready()" (click)="jump(-10)" aria-label="Rewind 10 seconds">
      <ion-icon name="play-back-outline" />
    </button>
    <button type="button" [disabled]="!ready()" (click)="playPause.emit()"
      [attr.aria-label]="playing() ? 'Pause recording' : 'Play recording'">
      <ion-icon [name]="playing() ? 'pause' : 'play'" />
    </button>
    <button type="button" [disabled]="!ready()" (click)="jump(10)" aria-label="Forward 10 seconds">
      <ion-icon name="play-forward-outline" />
    </button>
    <span class="spacer"></span>
    <button type="button" (click)="changeSpeed.emit()" aria-label="Change playback speed">
      {{ speed() }}x
    </button>
    <button type="button" (click)="close.emit()" aria-label="Close recording progress">
      <ion-icon name="close-outline" />
    </button>
  </div>
</div>

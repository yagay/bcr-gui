<app-header [title]="version.appName" [actionButtons]="actionButtons" [showCustomContent]="isMultiselect()">
  <ion-buttons slot="start">
    <ion-button (click)="clearSelection()" aria-label="Cancel selection">
      <ion-icon name="close" slot="icon-only" />
    </ion-button>
  </ion-buttons>
  <ion-buttons slot="end">
    <ion-button (click)="selectAll()" aria-label="Select all recordings">
      <ion-icon src="/assets/icons/select-all.svg" slot="icon-only" />
    </ion-button>
    <ion-button (click)="deleteItems(getSelectedItems())" aria-label="Delete selected recordings">
      <ion-icon name="trash" slot="icon-only" />
    </ion-button>
  </ion-buttons>
</app-header>

@if (isSearch()) {
  <ion-toolbar>
    <ion-searchbar #searchBar show-clear-button="focus" [debounce]="500"
      [(ngModel)]="searchValue" [placeholder]="'LBL_SEARCH' | translatePipe"
      (ionClear)="clearFilter()" />
  </ion-toolbar>
}

<app-history-controls [zh]="isZh" [direction]="directionFilter()" [total]="indexedCount()"
  [contactCount]="groupCount()" [matches]="historyIntegrity().sourceCount"
  [hasFilter]="!!searchValue() || directionFilter() !== 'all'"
  [allRecordings]="showAllRecordings()" [refreshing]="isRefreshing()"
  (directionChange)="setDirectionFilter($event)" (toggleView)="toggleViewMode()"
  (refresh)="refreshFromToolbar()" />

<ion-content id="main-content" class="main-content" [scrollY]="false">
  <div class="history-layout">
    <section class="history-list-area" [attr.aria-label]="isZh ? '录音历史' : 'Recording history'">
      <ion-refresher slot="fixed" [disabled]="topIndex > 0" (ionRefresh)="refreshList($any($event))">
        <ion-refresher-content refreshingSpinner="circles" />
      </ion-refresher>
      <cdk-virtual-scroll-viewport #vsv class="virtual-scroll-viewport ion-content-scroll-host"
        [itemSize]="itemHeight" [minBufferPx]="480" [maxBufferPx]="960"
        (scrolledIndexChange)="onScroll($event)">
        <app-history-recording-row
          *cdkVirtualFor="let item of items(); trackBy: trackByUri"
          [recording]="item"
          [isHeader]="showAllRecordings() || isGroupHeader(item)"
          [groupCount]="showAllRecordings() ? 1 : getGroupCount(item)"
          [expanded]="expandedGroupKey() === getGroupKey(item)"
          [selected]="!!item.selected" [playing]="isRowPlaying(item)" [multiselect]="isMultiselect()" [zh]="isZh"
          (opened)="onRowClick(item)" (playClicked)="onPlayRow(item)"
          (expandedClicked)="toggleGroup(item)" (longPressed)="startMultiselection(item)" />
      </cdk-virtual-scroll-viewport>
      <app-virtual-scrollbar class="virtual-scrollbar" [virtualScrollViewport]="vsv" />
      @if (items().length === 0 && recordingsService.refreshProgress() === undefined) {
        <div class="history-empty">
          <strong>{{ isZh ? '没有匹配的录音' : 'No matching recordings' }}</strong>
          <span>{{ isZh ? '请尝试调整搜索、筛选或录音目录' : 'Try another filter, search or recording directory' }}</span>
        </div>
      }
    </section>

    @if (selectedItem() && !isMultiselect()) {
      <app-history-details [recording]="selectedItem()!" [zh]="isZh"
        [dialUri]="isDialableNumber(selectedItem()!) ? getDialUri(selectedItem()!) : null"
        (close)="clearSelection()" (edit)="editItem(selectedItem()!)"
        (share)="shareRecording(selectedItem()!)" (delete)="deleteItems([selectedItem()!])" />
      <!-- One player, outside CDK. Selecting or scrolling never remounts another. -->
      <app-audio-player #audioPlayer class="player" [recording]="selectedItem()!"
        (onSkip)="onSkip($event)" />
    }
  </div>
</ion-content>

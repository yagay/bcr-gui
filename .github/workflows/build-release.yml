name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build Angular frontend
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/bcr-gui-release.jks"
          KEYSTORE_PROPS="$RUNNER_TEMP/keystore.properties"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            printf 'storeFile=%s\n' "$KEYSTORE_FILE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=bcr-gui-release\n'
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } > "$KEYSTORE_PROPS"

          echo "ANDROID_KEYSTORE_PROPS=$KEYSTORE_PROPS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and verify APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          APP_VERSION="$(basename "$APK" | sed -E 's/^bcr-gui-(.+)-release\.apk$/\1/')"
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION-fork.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=BCR-GUI $APP_VERSION fork.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.RELEASE_TITLE }}
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --generate-notes

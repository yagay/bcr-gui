name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feature/call-log-ui

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify complete-history scan and cache protections
        run: |
          node --experimental-strip-types --test scripts/tests/history-scan.test.mts
          node scripts/check-history-completeness.mjs

      - name: Build Angular frontend and validate call-history templates
        run: npm run build

      - name: Type-check call-history unit tests
        run: npx tsc --noEmit --project tsconfig.call-history-spec.json

      # 必须执行：把最新的 www 内容复制进 Android 工程
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build arm64-v8a debug APK
        working-directory: android
        run: ./gradlew -PciArm64Only=true assembleDebug --no-daemon

      - name: Prepare fixed APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ABIS="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected ABIs in APK: $ABIS"
            exit 1
          fi
          cp "$APK" artifacts/bcr-gui-debug-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: bcr-gui-debug-arm64-v8a
          path: artifacts/bcr-gui-debug-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

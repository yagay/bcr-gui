name: Build original BCR-GUI Debug

on:
  workflow_dispatch:
  push:
    branches:
      - feature/call-log-ui

permissions:
  contents: read

concurrency:
  group: bcr-gui-original-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build Debug APK only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout original source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Make legacy Capacitor 6 compatible with modern Android Gradle Plugin
        # Only patch the downloaded dependency during CI; original source stays unchanged.
        run: |
          sed -i "s/proguard-android\\.txt/proguard-android-optimize.txt/g" node_modules/@capacitor/android/capacitor/build.gradle

      - name: Build original Angular UI
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Assemble Debug only
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bcr-gui-original-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
